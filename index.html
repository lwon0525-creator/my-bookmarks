<style>
*{box-sizing:border-box} body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:18px} .hero{background:#111827;color:white;border-radius:26px;padding:24px;box-shadow:0 10px 30px #0f172a18}
h1{margin:0 0 8px;font-size:28px} .sub{color:#cbd5e1;font-size:14px} .search{width:100%;margin-top:18px;padding:15px 16px;border:0;border-radius:15px;font-size:16px}
.filters{display:flex;gap:9px;overflow:auto;padding:18px 2px 10px} .filter,.reorder{border:1px solid #dbe1ea;background:white;border-radius:999px;padding:10px 14px;font-weight:800;white-space:nowrap}
.filter.active{background:#111827;color:white} .toolbar{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 14px;color:#64748b;font-size:13px}
.reorder{border-radius:12px} .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{display:flex;align-items:center;gap:10px;background:white;border:1px solid #e7ebf0;border-radius:16px;padding:12px;min-height:76px;box-shadow:0 3px 12px #0f172a0a}
.favicon{width:40px;height:40px;min-width:40px;border-radius:12px;background:#eef2f7;display:grid;place-items:center;font-weight:900} .ct{min-width:0;flex:1}
.title{font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .meta{font-size:11px;color:#94a3b8;margin-top:3px}
.post{font-size:12px;color:#475569;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .date{font-size:10px;color:#94a3b8;margin-top:2px}
.status{font-size:10px;font-weight:900;margin-left:6px} .new{color:#dc2626} .read{color:#16a34a}
.open,.latest{text-decoration:none} .open{font-size:20px;color:#94a3b8;padding:5px} .latest{display:none;background:#111827;color:white;border-radius:9px;padding:7px 8px;font-size:11px;font-weight:800}
.card.haspost .latest{display:inline-block} .move{display:none;gap:4px} .reordering .move{display:flex} .move button{width:32px;height:32px;border:1px solid #dbe1ea;background:white;border-radius:9px;font-size:16px}
.empty{display:none;text-align:center;padding:40px;color:#64748b}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.wrap{padding:12px}.hero{padding:20px;border-radius:22px}h1{font-size:26px}.grid{grid-template-columns:1fr}.card{min-height:80px}}
</style>

<script>
const base=JSON.parse(document.getElementById('bookmark-data').textContent);
const ORDERKEY='bookmarkDashboardOrderV4', READKEY='bookmarkDashboardReadLatestV3';
let order=JSON.parse(localStorage.getItem(ORDERKEY)||'[]');
let read=JSON.parse(localStorage.getItem(READKEY)||'{}');
let latest={}, cat='전체', reordering=false;
const q=document.getElementById('q'), grid=document.getElementById('grid'), filters=document.getElementById('filters'), count=document.getElementById('count');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function key(x){return x.title+'|'+x.url}
function sorted(){let a=[...base]; if(order.length) a.sort((x,y)=>{let ix=order.indexOf(key(x)),iy=order.indexOf(key(y));return (ix<0?9999:ix)-(iy<0?9999:iy)}); return a}
function saveOrder(a){order=a.map(key);localStorage.setItem(ORDERKEY,JSON.stringify(order))}
function renderFilters(){const cs=['전체',...new Set(base.map(x=>x.category))];filters.innerHTML='';cs.forEach(c=>{let b=document.createElement('button');b.className='filter'+(c===cat?' active':'');b.textContent=c;b.onclick=()=>{cat=c;renderFilters();render()};filters.appendChild(b)})}
function render(){
  let all=sorted(), term=q.value.trim().toLowerCase();
  let view=all.filter(x=>(cat==='전체'||x.category===cat)&&(!term||(x.title+' '+x.category).toLowerCase().includes(term)));
  grid.className='grid'+(reordering?' reordering':''); grid.innerHTML='';
  view.forEach(x=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="favicon">${esc(x.title.slice(0,1))}</div><div class="ct"><div class="title">${esc(x.title)}<span class="status"></span></div><div class="meta">${esc(x.category)}</div><div class="post"></div><div class="date"></div></div><div class="move"><button class="up">↑</button><button class="down">↓</button></div><a class="latest" target="_blank" rel="noopener">최신글</a><a class="open" target="_blank" rel="noopener" href="${esc(x.url)}">↗</a>`;
    if(x.blogId && latest[x.blogId]?.ok){
      const p=latest[x.blogId], isNew=read[x.blogId]!==p.postUrl, st=c.querySelector('.status');
      st.textContent=isNew?'● NEW':'✓ 읽음'; st.className='status '+(isNew?'new':'read');
      c.querySelector('.post').textContent=p.postTitle||'최신글';
      const d=new Date(p.pubDate); c.querySelector('.date').textContent=isNaN(d)?'':new Intl.DateTimeFormat('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(d);
      const a=c.querySelector('.latest');a.href=p.postUrl;c.classList.add('haspost');
      a.onclick=()=>{read[x.blogId]=p.postUrl;localStorage.setItem(READKEY,JSON.stringify(read));setTimeout(render,150)};
    }
    c.querySelector('.up').onclick=()=>move(x,-1);c.querySelector('.down').onclick=()=>move(x,1);grid.appendChild(c);
  });
  count.textContent=view.length+'개 표시';document.getElementById('empty').style.display=view.length?'none':'block';
}
function move(x,dir){let a=sorted(),i=a.findIndex(z=>key(z)===key(x)),j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];saveOrder(a);render()}
document.getElementById('reorder').onclick=()=>{reordering=!reordering;document.getElementById('reorder').textContent=reordering?'✓ 순서 변경 완료':'↕ 순서 변경';render()};
q.oninput=render;
async function loadLatest(){try{let r=await fetch('./data/latest.json?ts='+Date.now(),{cache:'no-store'});if(r.ok)latest=await r.json()}catch(e){}render()}
renderFilters();render();loadLatest();
</script>
