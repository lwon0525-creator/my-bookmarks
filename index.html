<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>My Bookmark Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;background:#f5f7fb;color:#111827}
.wrap{max-width:1180px;margin:auto;padding:24px 16px 60px}.hero{background:#111827;color:#fff;border-radius:22px;padding:25px;box-shadow:0 12px 30px #0002}
h1{margin:0 0 6px;font-size:27px}.sub{color:#cbd5e1;font-size:13px}.search{width:100%;margin-top:17px;padding:14px 16px;border:0;border-radius:13px;font-size:16px}
.filters{display:flex;gap:8px;overflow:auto;padding:17px 1px 10px}.filter{border:1px solid #dbe1ea;background:#fff;padding:9px 13px;border-radius:999px;font-weight:700;white-space:nowrap}
.filter.active{background:#111827;color:#fff}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px;color:#64748b;font-size:13px}
.hint{display:none}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e7ebf0;border-radius:15px;padding:11px;min-height:72px;box-shadow:0 3px 12px #0f172a0a}
.drag{display:none;font-size:22px;color:#94a3b8;cursor:grab;user-select:none;padding:5px}.favicon{width:40px;height:40px;min-width:40px;border-radius:11px;background:#eef2f7;display:grid;place-items:center;font-weight:800}
.ct{min-width:0;flex:1}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:#94a3b8;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.open{text-decoration:none;color:#94a3b8;font-size:20px;padding:5px}.move{display:none;gap:4px}.move button{border:1px solid #dbe1ea;background:#fff;border-radius:9px;width:34px;height:34px;font-size:17px}
body.reorder .drag,body.reorder .move{display:flex}body.reorder .open{display:none}body.reorder .hint{display:block}.reorderBtn{border:0;background:#fff;padding:9px 12px;border-radius:10px;font-weight:800;box-shadow:0 2px 8px #0001}
.card.dragging{opacity:.4}.empty{text-align:center;padding:40px;color:#64748b;display:none}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.wrap{padding:12px 10px 40px}.hero{padding:20px 16px}.grid{grid-template-columns:1fr}h1{font-size:23px}}
</style></head><body><main class="wrap">
<section class="hero"><h1>🔖 My Bookmarks</h1><div class="sub">중요도에 따라 직접 순서를 바꾸고, 이 기기에서 순서를 기억합니다.</div>
<input id="q" class="search" placeholder="사이트 이름 검색"></section>

<div id="autoTest" style="margin:16px 0;background:#fff;border:1px solid #e7ebf0;border-radius:18px;padding:16px">
 <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
  <div><b>🧪 GitHub 자동수집 테스트</b><div style="font-size:12px;color:#64748b;margin-top:3px">3개 블로그 · latest.json 기반</div></div>
  <button id="refreshAuto" class="reorderBtn">새 글 확인</button>
 </div>
 <div id="autoRows" style="margin-top:12px;display:grid;gap:8px"></div>
</div>
<div id="filters" class="filters"></div>
<div class="toolbar"><span id="count"></span><button id="reorderBtn" class="reorderBtn">↕ 블로그 순서 최종 변경</button></div>
<div class="hint" id="hint">블로그·콘텐츠를 선택한 뒤 모바일은 ↑ ↓, PC는 ☰ 드래그로 원하는 최종 순서를 정하세요. 저장 완료를 누르면 이 기기에 기억됩니다.</div>
<section id="grid" class="grid"></section><div id="empty" class="empty">검색 결과가 없습니다.</div>
</main>

le": "닥터마빈", "url": "https://blog.naver.com/marbin1982", "category": "블로그·콘텐츠", "folder": ""}, {"title": "짠돌이", "url": "https://m.blog.naver.com/jjandol_?tab=1", "category": "블로그·콘텐츠", "folder": ""}, {"title": "작은투자", "url": "https://m.blog.naver.com/richyun0108?tab=1", "category": "블로그·콘텐츠", "folder": ""}, {"title": "습관", "url": "https://m.blog.naver.com/cy2863?tab=1", "category": "블로그·콘텐츠", "folder": ""}, {"title": "지금", "url": "https://m.blog.naver.com/rwwrhappy?tab=1", "category": "블로그·콘텐츠", "folder": ""}, {"title": "알바트로스", "url": "https://blog.naver.com/pillion21", "category": "블로그·콘텐츠", "folder": ""}, {"title": "이것 또한 지나가리라", "url": "https://blog.naver.com/tosoha1", "category": "블로그·콘텐츠", "folder": ""}, {"title": "재개발닷컴", "url": "https://jaegebal.com/", "category": "데이터·정보", "folder": ""}, {"title": "한국 수출 산업 월별 트렌드 대시보드", "url": "https://mosobamboocompany.github.io/korea-export-dashboard/", "category": "데이터·정보", "folder": ""}, {"title": "그러면서 투자하렵니까?", "url": "https://m.blog.naver.com/PostList.naver?blogId=quantum_edge&tab=1", "category": "블로그·콘텐츠", "folder": ""}, {"title": "코스피랩 — 국내주식 시세 비교 대시보드", "url": "https://kospilab.com/", "category": "데이터·정보", "folder": ""}, {"title": "페더씨의 기만채널 | BrinK", "url": "https://www.thebrink.co.kr/channel/feathersmacro?utm_source=copy_link&utm_medium=social_share&utm_campaign=channel_share&channel_id=feathersmacro", "category": "데이터·정보", "folder": ""}, {"title": "G' day", "url": "https://m.blog.naver.com/PostList.naver?blogId=skyrocket_jake&categoryNo=0&listStyle=post&tab=1&trackingCode=blog_comment", "category": "블로그·콘텐츠", "folder": ""}, {"title": "민이군의 기록의 공간 : 네이버 블로그", "url": "https://blog.naver.com/bymin0418", "category": "맛집", "folder": ""}, {"title": "움훼훼의 얼씨구 절씨구 밥타령! : 네이버 블로그", "url": "https://blog.naver.com/umstar81", "category": "맛집", "folder": ""}, {"title": "세콰노의 머거머거 : 네이버 블로그", "url": "https://blog.naver.com/gypsyone", "category": "맛집", "folder": ""}, {"title": "스윗모카의 Foodie Life~ : 네이버 블로그", "url": "https://blog.naver.com/sweetmocha77", "category": "맛집", "folder": ""}, {"title": "먹자, 마시자, 놀러 다니자 : 네이버 블로그", "url": "https://blog.naver.com/mardukas", "category": "맛집", "folder": ""}, {"title": "빠숑의 세상 답사기 : 네이버 블로그", "url": "https://blog.naver.com/ppassong", "category": "맛집", "folder": ""}, {"title": "부동산 투자시 절대 실패하지 않는 공식 : 네이버 블로그", "url": "https://blog.naver.com/ssaurajin7/220549973948", "category": "맛집", "folder": ""}, {"title": "행복 부동산 투자 앨리스허 : 네이버 블로그", "url": "https://blog.naver.com/alicehuh2k", "category": "맛집", "folder": ""}, {"title": "강남구청역 맛집 추천 호루몬규상 야끼니꾸 핫플.. : 네이버블로그", "url": "https://blog.naver.com/kizaki56/224162079124", "category": "맛집", "folder": ""}];
const KEY='bookmarkDashboardOrderV2';
let order=JSON.parse(localStorage.getItem(KEY)||'null')||base.map(x=>x.url);
function ordered(){let m=new Map(base.map(x=>[x.url,x]));let out=[];order.forEach(u=>{if(m.has(u)){out.push(m.get(u));m.delete(u)}});m.forEach(x=>out.push(x));return out}
let cat='all', reorder=false;
const preferred=['블로그·콘텐츠','맛집','투자·경제','업무·도구','뉴스·정보','데이터·정보']; const present=new Set(base.map(x=>x.category)); const cats=['전체',...preferred.filter(x=>present.has(x)),...[...present].filter(x=>!preferred.includes(x))];
const filters=document.getElementById('filters'),grid=document.getElementById('grid'),q=document.getElementById('q');
cats.forEach((c,i)=>{let b=document.createElement('button');b.className='filter'+(i===0?' active':'');b.textContent=c;b.onclick=()=>{[...filters.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=i===0?'all':c;render()};filters.appendChild(b)});
function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function move(url,d){let arr=order.filter(u=>u!==url);let idx=order.indexOf(url);let ni=Math.max(0,Math.min(order.length-1,idx+d));arr.splice(ni,0,url);order=arr;save();render()}
function save(){localStorage.setItem(KEY,JSON.stringify(order))}
function render(){
 let s=q.value.trim().toLowerCase(), arr=ordered().filter(x=>(cat==='all'||x.category===cat)&&(!s||(x.title+' '+x.folder).toLowerCase().includes(s)));
 grid.innerHTML=''; document.getElementById('count').textContent=arr.length+'개 표시';document.getElementById('empty').style.display=arr.length?'none':'block';
 arr.forEach(x=>{let c=document.createElement('div');c.className='card';c.draggable=reorder;c.dataset.url=x.url;
 c.innerHTML=`<div class="drag">☰</div><div class="favicon">${esc(x.title.slice(0,1))}</div><div class="ct"><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.category)}</div></div><div class="move"><button class="up">↑</button><button class="down">↓</button></div><a class="open" target="_blank" rel="noopener" href="${esc(x.url)}">↗</a>`;
 c.querySelector('.up').onclick=()=>move(x.url,-1);c.querySelector('.down').onclick=()=>move(x.url,1);
 c.ondragstart=()=>c.classList.add('dragging');c.ondragend=()=>{c.classList.remove('dragging');syncVisibleOrder()};
 c.ondragover=e=>{e.preventDefault();let d=document.querySelector('.dragging');if(!d||d===c)return;let r=c.getBoundingClientRect();grid.insertBefore(d,e.clientY<r.top+r.height/2?c:c.nextSibling)};
 grid.appendChild(c)
 })
}
function syncVisibleOrder(){let vis=[...grid.children].map(c=>c.dataset.url), set=new Set(vis),it=vis[Symbol.iterator]();order=order.map(u=>set.has(u)?it.next().value:u);save();render()}
document.getElementById('reorderBtn').onclick=()=>{reorder=!reorder;document.body.classList.toggle('reorder',reorder);document.getElementById('reorderBtn').textContent=reorder?'✓ 순서 저장 완료':'↕ 블로그 순서 최종 변경';render()}
q.oninput=render;render();

const TEST_BLOGS=[{"title": "시간으로부터의 자유", "id": "calmwaves", "url": "https://blog.naver.com/calmwaves"}, {"title": "쏘쟁", "id": "zenwolf", "url": "https://blog.naver.com/zenwolf"}, {"title": "트루카피", "id": "audi72", "url": "https://blog.naver.com/audi72"}];
const READ_POSTS_KEY='bookmarkDashboardReadPostsGithubV1';
let readPostsGithub=JSON.parse(localStorage.getItem(READ_POSTS_KEY)||'{}');

function niceDate(v){
  if(!v) return '';
  const d=new Date(v); if(isNaN(d)) return v;
  return new Intl.DateTimeFormat('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(d);
}
async function loadAutoPosts(){
 const box=document.getElementById('autoRows');
 box.innerHTML='<div style="color:#64748b">GitHub 수집 데이터 확인 중…</div>';
 try{
  const r=await fetch('./data/latest.json?ts='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('latest.json 없음 (HTTP '+r.status+')');
  const data=await r.json(); box.innerHTML='';
  for(const b of TEST_BLOGS){
   const p=data[b.id]||{};
   const row=document.createElement('div');
   row.style.cssText='border:1px solid #edf0f4;border-radius:12px;padding:11px';
   if(!p.ok){
    row.innerHTML=`<b>${esc(b.title)}</b><div style="font-size:12px;color:#dc2626;margin-top:5px">수집 실패: ${esc(p.error||'데이터 없음')}</div>`;
   }else{
    const isNew=readPostsGithub[b.id]!==p.postUrl;
    row.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(b.title)}</b><b style="color:${isNew?'#dc2626':'#16a34a'}">${isNew?'● NEW':'✓ 읽음'}</b></div>
    <div style="font-size:13px;margin-top:6px">${esc(p.postTitle||'최신 글')}</div>
    <div style="font-size:11px;color:#94a3b8;margin-top:4px">${esc(niceDate(p.pubDate))}</div>
    <div style="margin-top:8px;display:flex;gap:7px"><a class="latestLink" target="_blank" rel="noopener" href="${esc(p.postUrl)}" style="text-decoration:none;background:#111827;color:#fff;padding:7px 10px;border-radius:8px;font-size:12px">최신글 보기</a><button class="readBtn" style="border:1px solid #dbe1ea;background:#fff;border-radius:8px;padding:7px 10px">✓ 읽음</button></div>`;
    const mark=()=>{readPostsGithub[b.id]=p.postUrl;localStorage.setItem(READ_POSTS_KEY,JSON.stringify(readPostsGithub));};
    row.querySelector('.latestLink').addEventListener('click',()=>{mark();setTimeout(loadAutoPosts,300)});
    row.querySelector('.readBtn').addEventListener('click',()=>{mark();loadAutoPosts()});
   }
   box.appendChild(row);
  }
 }catch(e){
  box.innerHTML=`<div style="color:#dc2626"><b>아직 자동수집 데이터가 없습니다.</b><br><span style="font-size:12px">${esc(String(e.message||e))}</span><br><span style="font-size:12px">GitHub Actions를 한 번 실행한 뒤 다시 확인하세요.</span></div>`;
 }
}
document.getElementById('refreshAuto').onclick=loadAutoPosts;
loadAutoPosts();

</script></body></html>
